<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep futuristic background gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Indigo & Purple electric gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Warm coral scale balance accent -->
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Subtle grid layout pattern in background -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1.5">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- Decorative Outer Tech Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#primary-grad)" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="12 16" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Centered Technical Balance Scales (Ethical/Parity Bias Auditor Symbol) -->
  <g transform="translate(16, 16)">
    <!-- Central column of scales / Neural trunk -->
    <line x1="240" y1="120" x2="240" y2="360" stroke="url(#primary-grad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="240" cy="110" r="14" fill="url(#accent-grad)" />
    
    <!-- Balance beam (Perfect horizontal compliance baseline) -->
    <path d="M 120 180 Q 240 160 360 180" fill="none" stroke="url(#primary-grad)" stroke-width="10" stroke-linecap="round" />
    
    <!-- Left Scale Pan suspended from beam -->
    <line x1="120" y1="180" x2="120" y2="280" stroke="#818cf8" stroke-width="3" stroke-opacity="0.7" />
    <line x1="120" y1="180" x2="150" y2="280" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="120" y1="180" x2="90" y2="280" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 75 280 C 75 305, 165 305, 165 280 Z" fill="url(#primary-grad)" fill-opacity="0.9" stroke="url(#primary-grad)" stroke-width="2" />
    
    <!-- Right Scale Pan (Slightly altered height/interaction or balanced) -->
    <line x1="360" y1="180" x2="360" y2="280" stroke="#818cf8" stroke-width="3" stroke-opacity="0.7" />
    <line x1="360" y1="180" x2="390" y2="280" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="360" y1="180" x2="330" y2="280" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 315 280 C 315 305, 405 305, 405 280 Z" fill="url(#primary-grad)" fill-opacity="0.9" stroke="url(#primary-grad)" stroke-width="2" />

    <!-- Overlaid glowing circuit node pathways (AI / Machine learning audit aesthetic) -->
    <g stroke="url(#accent-grad)" stroke-width="2.5" fill="none" opacity="0.85">
      <!-- Left side synapses -->
      <path d="M 240 160 L 170 120 L 130 140" />
      <path d="M 240 220 L 170 260 L 140 230" />
      
      <!-- Right side synapses -->
      <path d="M 240 160 L 310 120 L 350 140" />
      <path d="M 240 220 L 310 260 L 340 230" />
      
      <!-- Connection points -->
      <circle cx="170" cy="120" r="5" fill="#f43f5e" />
      <circle cx="130" cy="140" r="5" fill="#f43f5e" />
      <circle cx="170" cy="260" r="5" fill="#f43f5e" />
      <circle cx="140" cy="230" r="5" fill="#f43f5e" />
      <circle cx="310" cy="120" r="5" fill="#f43f5e" />
      <circle cx="350" cy="140" r="5" fill="#f43f5e" />
      <circle cx="310" cy="260" r="5" fill="#f43f5e" />
      <circle cx="340" cy="230" r="5" fill="#f43f5e" />
    </g>

    <!-- Glowing Base Stand -->
    <path d="M 180 360 L 300 360" stroke="url(#primary-grad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 200 375 L 280 375" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
