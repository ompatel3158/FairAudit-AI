<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>FairAudit Ai</title>
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Mobile Status Bar Coloring -->
    <meta name="theme-color" content="#4f46e5" />
    <!-- Apple Safari & Standard PWA Mobile Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FairAudit" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Registration Lifecycle -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('FairAudit AI PWA Service Worker online with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('FairAudit AI PWA registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
